name: Git Forge tests
on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/forge-source-contract.yml"
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: git-forge-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read Git Forge source without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install the declared dependencies from the Group registry
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/
          npm ls --omit=dev --depth=0
      - name: Check and test
        run: npm run verify
      - name: Verify package layout without publishing
        run: npm pack --dry-run --ignore-scripts
