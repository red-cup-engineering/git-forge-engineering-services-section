name: Forge source contract
on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/forge-source-contract.yml"
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: forge-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Validate and test pure source contract
        run: |
          npm run check
          npm test
      - name: Check out exact upstream Software Forge source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/software-forge-engineering-services-section
          ref: 744cbe9608ad0cfbe4779587ac959018406192f7
          path: software-forge-upstream
          persist-credentials: false
      - name: Bind the original source export for native integration
        run: |
          set -euo pipefail
          test "$(git -C software-forge-upstream rev-parse HEAD)" = "744cbe9608ad0cfbe4779587ac959018406192f7"
          test "$(git hash-object software-forge-upstream/src/source-candidate.mjs)" = "829d851928ecc4bac27f485068df7d56c997f044"
          mkdir -p node_modules/@red-cup-engineering
          ln -s "$GITHUB_WORKSPACE/software-forge-upstream" node_modules/@red-cup-engineering/software-forge-services-section
          node --test test/integration-from-software-forge.test.mjs
      - name: Run native published SignCraft through pinned Software Forge and Git Forge
        run: |
          set -euo pipefail
          npm install --prefix software-forge-upstream --ignore-scripts --no-audit --no-fund --no-package-lock --registry=https://registry.561.group/
          node -e "const p=require('./software-forge-upstream/node_modules/@red-cup-engineering/signcraft/package.json'); if(p.name!=='@red-cup-engineering/signcraft'||p.version!=='0.5.6') process.exit(1)"
          ln -s "$GITHUB_WORKSPACE/software-forge-upstream/node_modules/@red-cup-engineering/signcraft" node_modules/@red-cup-engineering/signcraft
          test "$(git hash-object software-forge-upstream/node_modules/@red-cup-engineering/signcraft/src/inference/generate.mjs)" = "24ee356f70183024f9cf15d192162442a06ac287"
          test "$(git hash-object software-forge-upstream/node_modules/@red-cup-engineering/signcraft/src/inference/kernel.mjs)" = "0730feced483602516c0abe11bd77564c2810787"
          test "$(git hash-object software-forge-upstream/node_modules/@red-cup-engineering/signcraft/src/inference/nuclei.mjs)" = "db39518eaeeac37fcb2b9e241486656872d0e986"
          node --test test/native-signcraft-chain.test.mjs
      - name: Source-select the original deterministic Code Fabrication maker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/javascript-node-code-fabrication-engineering-services-section
          ref: 920908ccbf94b25c40000175607be1bfd1ce92fc
          path: code-fabrication-upstream
          persist-credentials: false
      - name: Bind exact real code-producing source for original Forge integration
        run: |
          set -euo pipefail
          test "$(git -C code-fabrication-upstream rev-parse HEAD)" = "920908ccbf94b25c40000175607be1bfd1ce92fc"
          test "$(git hash-object code-fabrication-upstream/scripts/transform-json-schema-to-typescript.mjs)" = "24c2000f79b8a4b941c5d0f7279afa7b1b4dea8b"
          node -e "const p=require('./code-fabrication-upstream/package.json');if(p.name!=='@red-cup-engineering/javascript-node-code-fabrication-services-section'||p.version!=='0.1.2')process.exit(1)"
          ln -s "$GITHUB_WORKSPACE/code-fabrication-upstream" node_modules/@red-cup-engineering/javascript-node-code-fabrication-services-section
          # Source-qualified producer checkout is NOT immutable registry release receiving.
      - name: Receive original published Git source-reader package rather than a checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published-git-source-reading
          npm pack --ignore-scripts --pack-destination published-git-source-reading --registry=https://registry.561.group/ @red-cup-engineering/git-source-reading-service@0.1.2
          set -- published-git-source-reading/*.tgz
          test "$#" -eq 1 && test -f "$1"
          tar -xzf "$1" -C published-git-source-reading
          node -e "const p=require('./published-git-source-reading/package/package.json'); if(p.name!=='@red-cup-engineering/git-source-reading-service'||p.version!=='0.1.2')process.exit(1)"
          test "$(git hash-object published-git-source-reading/package/src/pinned-source-files.mjs)" = "2af40a0155caf1a5d230c2d3857cf15e760e31b6"
          test -x "$(command -v git)"
          ln -s "$GITHUB_WORKSPACE/published-git-source-reading/package" node_modules/@red-cup-engineering/git-source-reading-service
          # The native Forge integration now consumes the published original
          # Git primitive, never silently substituting this worktree's HEAD.
      - name: Source-select the original merged Specification Engineering record
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: red-cup-engineering/specification-engineering-services-section
          ref: 333ed53070ae37043ea021ae271039903e5e68eb
          path: specification-upstream
          persist-credentials: false
      - name: Qualify immutable actual architecture candidate schema before Code generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C specification-upstream rev-parse HEAD)" = "333ed53070ae37043ea021ae271039903e5e68eb"
          test "$(git hash-object specification-upstream/data/records/schema/architecture-description.schema.json)" = "c11c025bc0aea8d7dbbd7e271519bf23b718d41f"
          node -e "const p=require('./specification-upstream/package.json');if(p.name!=='@red-cup-engineering/specification-engineering-services-section'||p.version!=='0.1.2')process.exit(1)"
          # Actual native test must independently read this original source
          # through the Git primitive, then generate code via Code and both Forges.
      - name: Exercise authentic released GitHub review planner without private CI
        run: |
          set -euo pipefail
          mkdir -p published-github-engineering
          # This test imports only the published dependency-free review-call
          # planner. Do not reify the provider's entire dependency closure:
          # that exhausted the five-minute runner budget at run 39863469131.
          npm pack --ignore-scripts --pack-destination published-github-engineering --registry=https://registry.561.group/ @red-cup-engineering/github-repository-hosting-service@0.3.3
          set -- published-github-engineering/*.tgz
          test "$#" -eq 1 && test -f "$1"
          tar -xzf "$1" -C published-github-engineering
          node -e "const p=require('./published-github-engineering/package/package.json');if(p.name!=='@red-cup-engineering/github-repository-hosting-service'||p.version!=='0.3.3')process.exit(1)"
          ln -s "$GITHUB_WORKSPACE/published-github-engineering/package" node_modules/@red-cup-engineering/github-repository-hosting-service
          node --test test/native-published-github-planner.test.mjs
      - name: Verify internal package layout without publishing
        run: npm pack --dry-run --ignore-scripts
